schemaVersion: 1
id: action-home-assistant
name: Home Assistant
version: 0.1.7
description: Discover and control Home Assistant lights, switches, TVs, media players, covers, climate, and other entities
interfaces:
  - id: home-assistant.action
    kind: action
    name: HomeAssistantCapability
    entry: .
    export: .
    className: HomeAssistantCapability
    description: Controls allowlisted Home Assistant entities through its REST API
    surfaces: [network, web, smart-home]
    permissions: [network.http, home-assistant.control]
    required: [env]
    config:
      - key: baseUrl
        env: HOME_ASSISTANT_URL
        type: string
        required: true
        description: Home Assistant origin, for example http://homeassistant.local:8123
      - key: token
        env: HOME_ASSISTANT_TOKEN
        type: secret
        required: true
        description: Home Assistant long-lived access token
      - key: entityDomains
        type: string
        required: false
        default: light,switch,fan,cover,lock,climate,scene,script,input_boolean,media_player
        description: Comma-separated entity domains visible to and controllable by this package
      - key: timeoutMs
        type: number
        required: false
        default: 10000
        description: Home Assistant request timeout in milliseconds
    capability:
      id: home-assistant.control
      version: 1.1.0
      name: control_home_assistant
      description: Read live entity states and control Home Assistant lights, switches, TVs, media players, fans, covers, locks, climate, scenes, scripts, and input booleans.
      permissions: [network.http, home-assistant.control]
      tags: [home-assistant, smart-home, state, status, devices, light, switch, tv, media-player, fan, cover, lock, climate, scene]
      execution: { timeoutMs: 15000, idempotent: false }
    startup: { when: ifConfigured }
    web: { entry: ./web/action, export: default, styles: ./web/styles.css }
  - id: home-assistant.jev
    kind: action
    name: HomeAssistantJevCapability
    entry: .
    export: .
    className: HomeAssistantJevCapability
    description: Executes natural-language Home Assistant commands with TypeSafe Jev, without a generative model
    surfaces: [network, web, smart-home]
    permissions: [network.http, home-assistant.control]
    required: [env]
    config:
      - key: baseUrl
        env: HOME_ASSISTANT_URL
        type: string
        required: true
        description: Home Assistant origin, for example http://homeassistant.local:8123
      - key: token
        env: HOME_ASSISTANT_TOKEN
        type: secret
        required: true
        description: Home Assistant long-lived access token
      - key: entityDomains
        type: string
        required: false
        default: light,switch,fan,cover,lock,climate,scene,script,input_boolean,media_player
        description: Comma-separated entity domains visible to and controllable by this package
      - key: timeoutMs
        type: number
        required: false
        default: 10000
        description: Home Assistant request timeout in milliseconds
      - key: apiKey
        env: JEV_API_KEY
        type: secret
        required: false
        description: TypeSafe Jev API key used to interpret the natural-language command
    capability:
      id: home-assistant.jev
      version: 1.0.0
      name: control_home_assistant_jev
      description: Takes a natural-language smart-home command and executes it without a generative model.
      permissions: [network.http, home-assistant.control]
      tags: [direct, home-assistant, smart-home, lights, light, luci, luce, spegnere, accendi, ufficio, switch, tv, media-player]
      execution: { timeoutMs: 20000, idempotent: false }
    startup: { when: ifConfigured }
    web: { entry: ./web/action, export: default, styles: ./web/styles.css }
