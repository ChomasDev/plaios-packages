schemaVersion: 1
id: agent-loop
name: Default Agent Loop
version: 0.1.0
description: Runs the selected model with dynamically discovered capabilities
interfaces:
  - id: agent-loop.agent
    kind: agent
    name: DefaultAgentLoop
    entry: .
    export: .
    className: DefaultAgentLoop
    description: Executes the model and capability loop for each incoming message
    surfaces: [local]
    required: [ai, discovery]
    config:
      - key: maxSteps
        type: number
        required: false
        default: 100
        description: Maximum model and capability steps
      - key: maxCapabilities
        type: number
        required: false
        default: 50
        description: Maximum capabilities loaded into one run
    startup:
      when: always
    web:
      entry: ./web/agent
      export: default
