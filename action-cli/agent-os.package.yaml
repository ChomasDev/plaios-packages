schemaVersion: 1
id: action-cli
name: CLI Inspector
version: 0.3.0
description: Runs commands on the server in full, read-only or allowlist mode, never forwarding secrets
interfaces:
  - id: action-cli.action
    kind: action
    name: RunCLICommandCapability
    entry: .
    export: .
    className: RunCLICommandCapability
    description: Runs a command on the server (full, read-only or allowlist mode) without forwarding secrets
    surfaces: [cli, local, filesystem]
    permissions: [cli.execute, filesystem.read]
    required: [env]
    config:
      - key: mode
        type: string
        required: false
        default: full
        description: "full runs any command; read-only runs inspection tools on any path; allowlist runs only allowedCommands inside the workspace"
      - key: allowedCommands
        type: string
        required: false
        default: echo,pwd,ls,whoami,date,find,stat,df,du,free,uname,ps,which,whereis,dpkg-query
        description: Comma-separated executables, used only in allowlist mode
      - key: timeoutMs
        type: number
        required: false
        default: 30000
        description: Per-command timeout
      - key: maxOutputBytes
        type: number
        required: false
        default: 32768
        description: Maximum stdout or stderr returned to the model
    capability:
      id: cli.run-command
      version: 1.0.0
      name: run_cli_command
      description: Runs a command on the PLAIOS server; what is accepted depends on the mode.
      permissions: [cli.execute, filesystem.read]
      tags: [cli, command, local, filesystem, packages, processes]
      execution: { timeoutMs: 30000, idempotent: false }
    startup: { when: always }
    web: { entry: ./web/action, export: default, styles: ./web/styles.css }
