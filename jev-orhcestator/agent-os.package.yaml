schemaVersion: 1
id: jev-orhcestator
name: JevOrhcestator
version: 0.1.8
description: TypeSafe Jev router that selects capabilities and output channels
interfaces:
  - id: jev-orhcestator.orchestrator
    kind: orchestrator
    name: JevOrhcestatorOrchestrator
    entry: .
    export: .
    className: JevOrhcestatorOrchestrator
    description: Chooses capability ids and an output channel with typed Jev judgments. Looks up protocol nodes in graph memory before routing, then sends matching commands directly to capabilities.
    required: [discovery]
    config:
      - key: maxCapabilities
        type: number
        required: false
        default: 50
        description: Maximum capabilities included in one routing decision
      - key: apiKey
        env: JEV_API_KEY
        type: secret
        required: false
        description: TypeSafe Jev API key used to choose capabilities
    web:
      entry: ./web/orchestrator
      export: default
      styles: ./web/styles.css
