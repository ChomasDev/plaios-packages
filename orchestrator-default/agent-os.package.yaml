schemaVersion: 1
id: orchestrator-default
name: Default Orchestrator
version: 0.1.3
description: Low-latency dynamic capability and output router with optional model routing
interfaces:
  - id: orchestrator-default.orchestrator
    kind: orchestrator
    name: DefaultOrchestrator
    entry: .
    export: .
    className: DefaultOrchestrator
    description: Chooses capability ids, primary output, additional outputs, and durable memory proposals
    surfaces: [local]
    required: [system2, discovery]
    config:
      - key: fastPath
        type: boolean
        required: false
        default: false
        description: Skip model routing for all single-output messages and use dynamic capability discovery plus the configured baseline
      - key: maxCapabilities
        type: number
        required: false
        default: 50
        description: Maximum capabilities included in one routing decision
      - key: minCapabilities
        type: number
        required: false
        default: 30
        description: Minimum installed capabilities made available to the agent after routing
      - key: instructions
        type: string
        required: false
        description: Optional routing instructions replacing the safe defaults
    startup: { when: always }
    web: { entry: ./web/orchestrator, export: default, styles: ./web/styles.css }
